{% extends "base.html" %}
{% block title %}Paws &amp; Homes | Page Not Found{% endblock %}

{% block head %}
<style>
    .not-found { max-width: 600px; margin: 0 auto; padding: 120px 24px; text-align: center; }
    .not-found h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; margin: 0 0 16px; }
    .not-found h1 i { color: #D97706; }
    .not-found p { color: #78716C; font-size: 1.1rem; line-height: 1.6; margin: 0 0 32px; }
    .not-found a {
        display: inline-block; background: #D97706; color: #fff; text-decoration: none;
        padding: 16px 40px; border-radius: 50px; font-weight: 600;
    }
</style>
{% endblock %}

{% block content %}
<main class="not-found">
    <h1>Page <i>not found</i></h1>
    <p>We couldn't find what you were looking for. The pet may already have found a home.</p>
    <a href="{{ url_for('adopt') }}">Meet our pets</a>
</main>
{% endblock %}
